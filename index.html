<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Сайт на обслуживании — Компания Варум</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --ink: #1c2430;
      --muted: #5c6775;
      --line: #e3e8ee;
      --accent: #ff1d61;
      --accent-dark: #e01052;
      --phone: #12324d;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 420px at 50% -80px, #dceee7 0%, transparent 70%),
        var(--bg);
      line-height: 1.5;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    .card {
      width: min(640px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 16px 40px rgba(18, 50, 77, 0.08);
      padding: 40px 36px 32px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      margin: 0 0 28px;
    }

    .logo {
      width: min(280px, 100%);
      height: auto;
      display: block;
    }

    .brand__tag {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      line-height: 1.25;
      font-weight: 700;
    }

    .lead {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 17px;
    }

    .contacts {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .contacts a {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--ink);
      background: #f7f9fb;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 18px;
      font-weight: 600;
    }

    .contacts a:hover {
      border-color: #b7d4c8;
      background: #f3faf7;
    }

    .contacts a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .value {
      display: block;
    }

    .hours {
      margin: 22px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .mail-btn {
      display: inline-flex;
      margin-top: 18px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      border-radius: 10px;
      padding: 12px 18px;
    }

    .mail-btn:hover { background: var(--accent-dark); }

    footer {
      width: min(640px, 100%);
      margin-top: 16px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 520px) {
      .card { padding: 28px 18px 22px; }
      h1 { font-size: 24px; }
      .contacts a { font-size: 16px; }
    }
  </style>
</head>
